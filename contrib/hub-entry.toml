id = "torznab"
name = "Torznab (unofficial)"
description = "Search a Torznab indexer (Prowlarr, Jackett, bitmagnet…) and play music straight from BitTorrent while it downloads: releases as albums, original files bit for bit, seeking ahead, gapless preload. Covers from the torrent or Cover Art Archive, favourites in your library. You choose the indexer; use it for what you have the right to download."
